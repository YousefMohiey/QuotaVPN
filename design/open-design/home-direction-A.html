<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuotaVPN - Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* ════════════════════════════════════════════════════════════════════
   1. Design-system tokens (Raycast) - the binding contract, verbatim.
   ════════════════════════════════════════════════════════════════════ */
:root {
  --bg:           #07080a;
  --surface:      #101111;
  --surface-warm: var(--surface);

  --fg:    #f9f9f9;
  --fg-2:  #cecece;
  --muted: #9c9c9d;
  --meta:  #6a6b6c;

  --border:      rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);

  --accent:        #FF6363;
  --accent-on:     #ffffff;
  --accent-hover:  #ff7777;
  --accent-active: #e85757;

  --success: hsl(151, 59%, 59%);
  --warn:    hsl(43, 100%, 60%);
  --danger:  hsl(0, 100%, 69%);

  --font-display: "Inter", "Inter Fallback", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter", "Inter Fallback", "SF Pro Text", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "GeistMono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  40px;
  --text-4xl:  64px;

  --leading-body:     1.6;
  --leading-tight:    1.1;
  --tracking-display: 0px;

  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  --section-y-desktop: 96px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  --radius-sm:   6px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-pill: 9999px;

  --elev-flat:   none;
  --elev-ring:   rgb(27, 28, 30) 0px 0px 0px 1px, rgb(7, 8, 10) 0px 0px 0px 1px inset;
  --elev-raised:
    rgba(255, 255, 255, 0.05) 0px 1px 0px 0px inset,
    rgba(0, 0, 0, 0.28) 0px 1.189px 2.377px,
    0 0 0 1px rgba(255, 255, 255, 0.06);

  --focus-ring: 0 0 0 3px hsla(202, 100%, 67%, 0.35);

  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ════════════════════════════════════════════════════════════════════
   2. Product binding - QuotaVPN's blue replaces the brand accent.
      Only the accent family is rebound; every other token is untouched.
   ════════════════════════════════════════════════════════════════════ */
:root {
  --brand:        #2e7bf6;   /* product primary                 */
  --brand-deep:   #1f59b6;   /* product deep - fills with text  */

  --accent:        var(--brand);
  --accent-hover:  #4f92f8;
  --accent-active: var(--brand-deep);
  --focus-ring:    0 0 0 3px color-mix(in srgb, var(--brand) 40%, transparent);

  /* Derived surfaces: never new hues, only steps off the system tokens. */
  --surface-2:  color-mix(in oklab, var(--surface) 88%, white);  /* dial disc  */
  --field:      color-mix(in oklab, var(--surface) 95%, white);  /* control fill */
  --row-fill:   color-mix(in srgb, white 2%, transparent);
  --row-hover:  color-mix(in srgb, white 5%, transparent);
  --hair-strong: color-mix(in srgb, white 13%, transparent);
  --brand-tint:      color-mix(in srgb, var(--brand) 13%, transparent);
  --brand-tint-soft: color-mix(in srgb, var(--brand) 8%, transparent);
  --brand-edge:      color-mix(in srgb, var(--brand) 45%, transparent);
}

/* ════════════════════════════════════════════════════════════════════
   3. Base
   ════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  line-height: var(--leading-body);
  letter-spacing: 0.2px;
  font-feature-settings: "calt" 1, "kern" 1, "liga" 1, "ss03" 1;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.select-text { user-select: text; }

#stage { width: calc(1060px * var(--fit, 1)); height: calc(700px * var(--fit, 1)); }

.app {
  width: 1060px;
  height: 700px;
  display: flex;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.62), 0 2px 6px rgba(0, 0, 0, 0.5);
  transform: scale(var(--fit, 1));
  transform-origin: top left;
}

/* ════════════════════════════════════════════════════════════════════
   4. Sidebar
   ════════════════════════════════════════════════════════════════════ */
.sidebar {
  flex: 0 0 200px;
  width: 200px;
  display: flex;
  flex-direction: column;
  padding: 18px 12px 12px;
  background: color-mix(in oklab, var(--bg) 68%, var(--surface));
  border-right: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; }

.brand-mark {
  width: 28px; height: 28px; border-radius: 9px; display: block; flex: 0 0 28px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 3px 9px rgba(0, 0, 0, 0.5);
}

.brand-name {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 600; letter-spacing: 0.2px; color: var(--fg);
}

.nav { display: flex; flex-direction: column; gap: 2px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 10px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: var(--text-sm); font-weight: 500; letter-spacing: 0.2px;
  text-align: left; text-decoration: none;
  transition: background-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; }
.nav-item:hover { background: var(--row-hover); color: var(--fg); }
.nav-item:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.nav-item.is-active { background: var(--brand-tint); color: var(--fg); }

.nav-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-soft); }

/* ════════════════════════════════════════════════════════════════════
   5. Main + cards
   ════════════════════════════════════════════════════════════════════ */
.main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: 20px var(--container-gutter-desktop);
}

.card {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: var(--space-5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* --- 5a. Connect module ------------------------------------------- */
.dial-row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

.dial {
  position: relative;
  width: 172px; height: 172px; flex: 0 0 172px;
  padding: 0; border: 0; border-radius: 50%;
  background: transparent; cursor: pointer;
}
.dial:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }

.dial-ring { position: absolute; inset: 0; transform: rotate(90deg); }
.dial-ring .track { stroke: rgba(255, 255, 255, 0.08); transition: stroke var(--motion-base) var(--ease-standard); }
.dial-ring .arc {
  stroke: var(--brand); opacity: 0.9;
  transition: stroke var(--motion-base) var(--ease-standard), opacity var(--motion-base) var(--ease-standard);
}
.dial:hover .dial-ring .track { stroke: rgba(255, 255, 255, 0.15); }

.dial-disc {
  position: absolute; inset: 15px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--surface-2);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.07),
    inset 0 -14px 28px rgba(0, 0, 0, 0.28),
    0 10px 24px rgba(0, 0, 0, 0.42);
  transition: background-color var(--motion-base) var(--ease-standard),
              box-shadow var(--motion-base) var(--ease-standard);
}
.dial:hover .dial-disc { background: color-mix(in oklab, var(--surface) 82%, white); }
.dial:active .dial-disc { transform: translateY(1px); }

.dial-glyph { width: 30px; height: 30px; color: var(--fg); transition: color var(--motion-base) var(--ease-standard); }
.dial-label { font-size: var(--text-sm); font-weight: 500; letter-spacing: 0.2px; color: var(--fg); }

.dial[data-state="connecting"] .dial-ring .arc,
.dial[data-state="disconnecting"] .dial-ring .arc { animation: arc-pulse 1.1s ease-in-out infinite; }
.dial[data-state="connecting"] .dial-glyph { color: var(--brand); }
.dial[data-state="on"] .dial-ring .arc { stroke: var(--success); opacity: 1; }
.dial[data-state="on"] .dial-glyph { color: var(--success); }

@keyframes arc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.facts {
  display: grid; grid-template-columns: repeat(3, 1fr);
  margin-top: var(--space-4); padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}

.fact { display: flex; align-items: center; gap: 12px; min-width: 0; padding-left: 20px; border-left: 1px solid var(--border-soft); }
.fact:first-child { padding-left: 0; border-left: 0; }

.fact-icon {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--row-fill); color: var(--fg-2);
}
.fact-icon svg { width: 15px; height: 15px; }
.fact-body { min-width: 0; }
.fact-label { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.2px; }
.fact-value {
  margin-top: 2px; display: flex; align-items: center; gap: 8px;
  font-size: var(--text-sm); color: var(--fg); min-width: 0;
}
.fact-value span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.flag { width: 18px; height: 12px; flex: 0 0 18px; border-radius: 2px; display: block; object-fit: cover;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16); }

.dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--danger); }
.dot.is-on { background: var(--success); }
.dot.is-live { background: var(--brand); animation: arc-pulse 1.1s ease-in-out infinite; }

/* --- 5b. Connection setup card ------------------------------------ */
.setup-card { justify-content: center; }

.setup-head h2 {
  margin: 0; font-family: var(--font-display);
  font-size: var(--text-xl); font-weight: 500; line-height: 1.3; letter-spacing: 0.2px; color: var(--fg);
}
.setup-head p { margin: 4px 0 0; font-size: var(--text-sm); color: var(--muted); letter-spacing: 0.2px; }

.setup-cols { display: grid; grid-template-columns: 0.9fr 1fr; margin-top: 18px; }
.col-presets { padding-right: 20px; min-width: 0; }
.col-config { padding-left: 20px; min-width: 0; border-left: 1px solid var(--border-soft); }

.col-label {
  font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}

.preset-list, .rows { display: flex; flex-direction: column; gap: var(--space-4); margin-top: 10px; }

.preset {
  display: flex; align-items: center; gap: 14px;
  height: 80px; padding: 0 16px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--row-fill); cursor: pointer; text-align: left; font-family: inherit;
  transition: border-color var(--motion-fast) var(--ease-standard),
              background-color var(--motion-fast) var(--ease-standard);
}
.preset:hover { border-color: var(--hair-strong); background: var(--row-hover); }
.preset:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.preset.is-selected { border-color: var(--brand-edge); background: var(--brand-tint-soft); }

.preset-tile {
  width: 44px; height: 44px; flex: 0 0 44px; border-radius: 10px;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--row-fill); color: var(--muted);
  transition: color var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              background-color var(--motion-fast) var(--ease-standard);
}
.preset-tile svg { width: 21px; height: 21px; }
.preset.is-selected .preset-tile { border-color: var(--brand-edge); background: var(--brand-tint); color: var(--brand); }

.preset-text { min-width: 0; flex: 1; }
.preset-name { display: block; font-size: var(--text-base); font-weight: 600; letter-spacing: 0.2px; color: var(--fg-2); }
.preset.is-selected .preset-name { color: var(--fg); }
.preset-domain { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0; color: var(--muted); }

.radio {
  width: 18px; height: 18px; flex: 0 0 18px; margin-left: 12px;
  border: 1.5px solid color-mix(in srgb, white 24%, transparent); border-radius: 50%;
  display: grid; place-items: center;
  transition: border-color var(--motion-fast) var(--ease-standard);
}
.preset.is-selected .radio { border-color: var(--brand); }
.radio i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); display: none; }
.preset.is-selected .radio i { display: block; }

.row { display: flex; align-items: center; gap: var(--space-2); height: 48px; }
.row-label {
  display: flex; align-items: center; gap: var(--space-2);
  width: 152px; flex: 0 0 152px; min-width: 0;
  font-size: var(--text-sm); color: var(--fg-2);
}
.row-icon {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--row-fill); color: var(--muted);
}
.row-icon svg { width: 14px; height: 14px; }
.row-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-ctl { flex: 1; min-width: 0; }

.ctl {
  width: 100%; height: 48px;
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--field);
  color: var(--fg-2); cursor: pointer; font-family: inherit; font-size: var(--text-sm);
  transition: border-color var(--motion-fast) var(--ease-standard),
              background-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.ctl:hover { border-color: var(--hair-strong); background: var(--row-hover); color: var(--fg); }
.ctl:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ctl-value { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl-value.mono { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0; }
.ctl .chev { width: 16px; height: 16px; flex: 0 0 16px; color: var(--muted); transition: color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); }
.ctl:hover .chev { color: var(--fg); }
.ctl:hover .chev.down { transform: translateY(1px); }
.ctl:hover .chev.right { transform: translateX(2px); }

.seg {
  width: 100%; height: 48px;
  display: flex; align-items: stretch; gap: 2px; padding: 4px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--field);
}
.seg-opt {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 0 2px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.2px;
  white-space: nowrap;
  transition: background-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard);
}
.seg-opt:hover { background: var(--row-hover); color: var(--fg); }
.seg-opt:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.seg-opt[aria-checked="true"] {
  background: var(--brand-deep); color: var(--accent-on);
  border-color: color-mix(in srgb, var(--brand) 55%, transparent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 2px 6px rgba(0, 0, 0, 0.35);
}
.seg-opt[aria-checked="true"]:hover { color: var(--accent-on); background: var(--brand-deep); }

/* ════════════════════════════════════════════════════════════════════
   6. Motion preference
   ════════════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .dot.is-live { animation: none; }
}
</style>
</head>

                    <span class="ctl-value mono">EA &middot; ea.com</span>
                    <svg class="chev down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M6.5 9.8 12 15.2l5.5-5.4"/>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="row" data-od-id="row-routing">
                <div class="row-label">
                  <span class="row-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3.4" y="3.8" width="7" height="7" rx="1.7"/>
                      <rect x="13.6" y="13.2" width="7" height="7" rx="1.7"/>
                      <path d="M6.9 10.8v6.2h6.7"/>
                    </svg>
                  </span>
                  <span>App routing</span>
                </div>
                <div class="row-ctl">
                  <button type="button" class="ctl" data-od-id="routing-select" aria-label="App routing, VPN for Whole device">
                    <span class="ctl-value">VPN for Whole device</span>
                    <svg class="chev right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M9.8 6.5 15.2 12l-5.4 5.5"/>

                </div>
              </div>

              <div class="row" data-od-id="row-transport">
                <div class="row-label">
                  <span class="row-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M9.4 4.4v3.4M14.6 4.4v3.4"/>
                      <path d="M6.9 7.8h10.2v3.4a5.1 5.1 0 0 1-10.2 0z"/>
                      <path d="M12 16.3v3.3"/>
                    </svg>
                  </span>
                  <span>Connection type</span>
                </div>
                <div class="row-ctl">
                  <div class="seg" role="radiogroup" aria-label="Connection type" data-od-id="transport-segmented">
                    <button type="button" class="seg-opt" role="radio" aria-checked="true" tabindex="0" data-od-id="transport-standard">Standard</button>
                    <button type="button" class="seg-opt" role="radio" aria-checked="false" tabindex="-1" data-od-id="transport-hysteria2">Hysteria2</button>
                    <button type="button" class="seg-opt" role="radio" aria-checked="false" tabindex="-1" data-od-id="transport-wireguard">WireGuard</button>
                  </div>
                </div>

            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
// Scale the fixed 1060x700 window to the viewport so the preview never
// crops it; 1:1 whenever the pane is large enough.
(function () {
  var stage = document.getElementById("stage");
  function fit() {
    var s = Math.min(1, (window.innerWidth - 32) / 1060, (window.innerHeight - 32) / 700);
    s = Math.max(0.35, s);
    document.documentElement.style.setProperty("--fit", String(s));
    stage.style.width = (1060 * s) + "px";
    stage.style.height = (700 * s) + "px";
  }
  fit();
  window.addEventListener("resize", fit);
})();

(function () {
  "use strict";

  /* ---- Connect dial: idle -> connecting -> on -> disconnecting ---- */
  var dial = document.getElementById("dial");
  var label = document.getElementById("dial-label");
  var statusDot = document.getElementById("status-dot");
  var statusValue = document.getElementById("status-value");
  var phase = "idle";
  var timer = null;

  var COPY = {
    idle:          { label: "Connect",       status: "Not connected" },
    connecting:    { label: "Connecting",    status: "Connecting" },
    on:            { label: "Disconnect",    status: "Connected" },
    disconnecting: { label: "Disconnecting", status: "Disconnecting" }
  };

  function paint() {
    var c = COPY[phase];
    dial.dataset.state = phase;
    dial.setAttribute("aria-pressed", phase === "on" ? "true" : "false");
    dial.setAttribute("aria-label", c.label);
    label.textContent = c.label;
    statusValue.textContent = c.status;
    statusDot.className = "dot" + (phase === "on" ? " is-on" : phase === "idle" ? "" : " is-live");
  }

  dial.addEventListener("click", function () {
    if (timer) { return; }
    if (phase === "idle") {
      phase = "connecting"; paint();
      timer = window.setTimeout(function () { timer = null; phase = "on"; paint(); }, 1100);
    } else if (phase === "on") {
      phase = "disconnecting"; paint();
      timer = window.setTimeout(function () { timer = null; phase = "idle"; paint(); }, 750);
    }
  });

  /* ---- Exclusive groups: presets + connection type ---- */
  function wireGroup(root) {
    var opts = Array.prototype.slice.call(root.querySelectorAll('[role="radio"]'));
    function pick(i) {
      opts.forEach(function (o, n) {
        o.setAttribute("aria-checked", n === i ? "true" : "false");
        o.tabIndex = n === i ? 0 : -1;
        if (root.classList.contains("preset-list")) { o.classList.toggle("is-selected", n === i); }
      });
    }
    opts.forEach(function (o, i) {
      o.addEventListener("click", function () { pick(i); o.focus(); });
      o.addEventListener("keydown", function (e) {
        var d = e.key === "ArrowDown" || e.key === "ArrowRight" ? 1
              : e.key === "ArrowUp" || e.key === "ArrowLeft" ? -1 : 0;
        if (!d) { return; }
        e.preventDefault();
        var n = (i + d + opts.length) % opts.length;
        pick(n); opts[n].focus();
      });
    });
  }
  [document.getElementById("preset-list"),
   document.querySelector('[data-od-id="transport-segmented"]')].forEach(wireGroup);

  paint();
})();
</script>
</body>
