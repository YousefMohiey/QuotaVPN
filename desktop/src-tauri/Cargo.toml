[package]
name = "quotacards-desktop"
version = "0.7.6-exp.15"
default-run = "QuotaVPN"
edition = "2021"

[lib]
name = "quotacards_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "QuotaVPN"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# Exit-address lookup for the speed page. In Rust so no webview policy,
# CORS rule or fetch quirk can block it. Rustls is already in the tree for
# the updater, so this adds no new TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The Spaces direct path creates its own Wintun adapter from the DLL the
# engine already installs. Loading it by path keeps the app from needing a
# second driver or a link-time dependency.
libloading = "0.8"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
# Shared core: card credentials and the Windows sing-box engine. The SSH
# control plane stays in the phone build only, so russh never enters this exe.
quotacards = { path = "../..", default-features = false }

sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Stable-port TCP listener and the control-connection port reuse that Radmin
# uses to keep a NAT mapping open for incoming peers.
socket2 = "0.5"
# TUN adapter byte counters for the live traffic chart.
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }
# WebView2 memory trimming while the window sits hidden in the tray
# (ICoreWebView2_19::SetMemoryUsageTargetLevel). Both are already in the
# dependency tree through tauri, so this adds no new downloads.
webview2-com = "0.38"
windows-core = "0.61"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The two command line harnesses are developer tools, not part of the product.
# Leaving them in a release build put three near-identical unsigned executables
# in the installer, which is exactly the shape antivirus heuristics dislike.
tools = []

[[bin]]
name = "clitest"
path = "src/bin/clitest.rs"
required-features = ["tools"]

[[bin]]
name = "spdtest"
path = "src/bin/spdtest.rs"
required-features = ["tools"]

[profile.release]
# The bare exe is served as a test download and folded into the installer:
# keep it lean (the default profile left ~17 MB of symbol table in it).
strip = true
