# Signs an installer that was built locally and uploaded to a draft release.
# There is no build step here: no cargo, no Tauri bundle, no NSIS.
# The updater private key exists only in the repository secrets.
name: sign-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag
        required: true
        default: v0.7.1

permissions:
  contents: write

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download the local installer from the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "QuotaVPN_*_x64-setup.exe" --dir dist --clobber
          if (-not (Test-Path "dist\QuotaVPN_*_x64-setup.exe")) { throw "no installer in the draft release" }
          Get-ChildItem dist

      - name: Sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not ${env:TAURI_SIGNING_PRIVATE_KEY}) { throw "the updater key secret is empty" }
          $exe = Get-ChildItem dist\QuotaVPN_*_x64-setup.exe | Select-Object -First 1
          npx --yes @tauri-apps/cli@2.11.4 signer sign $exe.FullName
          $sig = Get-ChildItem dist\*.sig | Select-Object -First 1
          if (-not $sig) { throw "the signer produced no .sig" }
          Get-ChildItem dist

      - name: Upload the signature to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sig = Get-ChildItem dist\*.sig | Select-Object -First 1
          gh release upload "${{ inputs.tag }}" $sig.FullName --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: updater-signature
          path: dist/*.sig
          archive: false
          if-no-files-found: error
