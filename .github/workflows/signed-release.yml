# Builds the Windows installer and publishes it.
#
# There is no code signing here. Every artifact this workflow produces is
# unsigned, which is why Windows SmartScreen warns on first run and why some
# antivirus heuristics quarantine it: an unsigned executable that self-updates and
# asks for Administrator reads like a dropper no matter what it actually does.
# The way out is an Authenticode certificate, and the day there is one, signing
# belongs in this file as a step before the two upload steps.

name: signed-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    # A hung build must not sit in progress for hours. The v0.6.1 run was still in its
    # Build step long after the release was published by hand, and nothing stopped it.
    timeout-minutes: 45
    runs-on: windows-latest
    # The secret has to sit in env, because the secrets context is not allowed
    # inside a step condition.
    env:
      # Booleans, not values. Conditions need to know whether a secret exists, and
      # a comparison in `env:` gives that without putting the secret back in scope
      # for every step.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # The updater key is scoped to the build step, not the job. At job level
      # every step inherited it, including `npm ci` and a floating `npx`, so any
      # package that answered to that version could read the key that signs every
      # client's updates.
      - uses: actions/checkout@v7
        with:
          # The job is already `contents: write`; a token left in .git/config by
          # checkout is one more credential for build-time code to find.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui-next/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Frontend dependencies
        working-directory: desktop/ui-next
        run: npm ci

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # No updater key configured yet: build the installer without the
            # updater manifest instead of failing on an empty key.
            npx --yes @tauri-apps/cli@2.11.4 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --yes @tauri-apps/cli@2.11.4 build
          fi

      # 0.6.6 shipped an exe with no manifest: it bound comctl32 v5, which has no
      # TaskDialogIndirect, and died before it could draw a window. A green build
      # is not evidence that the manifest is in the binary, so this reads the
      # binary. The manifest has to name Common-Controls 6 for the loader to pick
      # the v6 DLL, so its presence is the whole check.
      - name: The exe really carries its manifest
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/QuotaVPN.exe"
          if (-not (Test-Path $exe)) { throw "no app binary at $exe" }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains("Microsoft.Windows.Common-Controls")) {
            throw "the exe has no Common-Controls 6 manifest, so it will fail at load"
          }
          if (-not $text.Contains("requireAdministrator")) {
            throw "the exe has no requested execution level, so the tunnel setup changes"
          }
          Write-Host "manifest present: Common-Controls 6 and requireAdministrator"

      - name: Upload the unsigned installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error

      # Its own artifact, because `archive: false` takes exactly one file. The
      # signature is what the updater feed quotes: a build whose signature was
      # never captured cannot be published to anybody who already has the app.
      - name: Upload the updater signature
        uses: actions/upload-artifact@v7
        with:
          name: updater-signature
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          archive: false
          if-no-files-found: error

      # The binary itself, so its contents can be checked without unpacking the
      # installer. NSIS compresses its payload, so `strings` on the setup file sees
      # only the installer's own metadata and proves nothing about what ships.
      - name: Upload the app binary
        uses: actions/upload-artifact@v7
        with:
          name: app-binary
          path: desktop/src-tauri/target/release/QuotaVPN.exe
          archive: false
          if-no-files-found: error

      # Assertions about what the binary must not contain. The driver fetch and the
      # updater feed override were both removed from the source; this is what catches
      # them coming back, and what proves they are actually gone from what ships.
      - name: The binary downloads nothing to execute
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/QuotaVPN.exe"
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          $bad = @{
            "WinDivert-2.2.2-A.zip" = "the app must not download a kernel driver"
            "QC_FEED_URL"           = "the app must not accept a feed override at runtime"
            "msSmartScreenProtection" = "the app must not disable SmartScreen"
          }
          foreach ($k in $bad.Keys) {
            if ($text.Contains($k)) { throw "$k is still in the binary: $($bad[$k])" }
          }
          Write-Host "checked: no driver download, no feed override, no SmartScreen disable"

      - name: The updater signature must exist
        shell: bash
        run: |
          set -e
          ls -la desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
