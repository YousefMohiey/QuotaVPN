name: Signed release

# Builds the Windows installer on a GitHub-hosted runner and has it signed by
# SignPath Foundation, which is the one route that costs nothing and still puts
# a real, publicly trusted certificate on the file.
#
# Setup, once the application is approved (see notes/code-signing.md):
#   secret  TAURI_SIGNING_PRIVATE_KEY            the updater key
#   secret  TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
#   secret  SIGNPATH_API_TOKEN                   from the SignPath project
#   vars    SIGNPATH_ORG_ID                      SignPath organization id
#   vars    SIGNPATH_PROJECT_SLUG                project slug
#   vars    SIGNPATH_POLICY_SLUG                 signing policy slug
#
# Without the SignPath secrets the workflow still builds, and leaves the
# installer as a downloadable artifact, unsigned and plainly labelled.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    # A hung build must not sit in progress for hours. The v0.6.1 run was still in its
    # Build step long after the release was published by hand, and nothing stopped it.
    timeout-minutes: 45
    runs-on: windows-latest
    # The secret has to sit in env, because the secrets context is not allowed
    # inside a step condition.
    env:
      # Booleans, not values. Conditions need to know whether a secret exists, and
      # a comparison in `env:` gives that without putting the secret back in scope
      # for every step.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      # The updater key and the SignPath token are scoped to the two steps that
      # need them, not to the job. At job level every step inherited them,
      # including `npm ci` and `npx --yes @tauri-apps/cli@2`, so any package that
      # answered to that floating version could read the key that signs every
      # client's updates.
      - uses: actions/checkout@v7
        with:
          # The job is already `contents: write`; a token left in .git/config by
          # checkout is one more credential for build-time code to find.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui-next/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Frontend dependencies
        working-directory: desktop/ui-next
        run: npm ci

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # No updater key configured yet: build the installer without the
            # updater manifest instead of failing on an empty key.
            npx --yes @tauri-apps/cli@2.11.4 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --yes @tauri-apps/cli@2.11.4 build
          fi

      # 0.6.6 shipped an exe with no manifest: it bound comctl32 v5, which has no
      # TaskDialogIndirect, and died before it could draw a window. A green build
      # is not evidence that the manifest is in the binary, so this reads the
      # binary. The manifest has to name Common-Controls 6 for the loader to pick
      # the v6 DLL, so its presence is the whole check.
      - name: The exe really carries its manifest
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/QuotaVPN.exe"
          if (-not (Test-Path $exe)) { throw "no app binary at $exe" }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains("Microsoft.Windows.Common-Controls")) {
            throw "the exe has no Common-Controls 6 manifest, so it will fail at load"
          }
          if (-not $text.Contains("requireAdministrator")) {
            throw "the exe has no requested execution level, so the tunnel setup changes"
          }
          Write-Host "manifest present: Common-Controls 6 and requireAdministrator"

      - name: Upload the unsigned installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error

      # Its own artifact, because `archive: false` takes exactly one file and the
      # installer artifact is the one SignPath consumes. The signature is what
      # the updater feed quotes: a build whose signature was never captured
      # cannot be published to anybody who already has the app.
      - name: Upload the updater signature
        uses: actions/upload-artifact@v7
        with:
          name: updater-signature
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          archive: false
          if-no-files-found: error

      - name: The updater signature must exist
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          set -e
          ls -la desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Sign with SignPath
        id: signpath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The updater signature has to cover the bytes people actually receive.
      # It is made here, over the signed file, because signing changes the hash
      # and the .sig that the bundler produced belongs to the unsigned build.
      - name: Sign the updater manifest
        if: env.HAS_SIGNPATH == 'true'
        shell: bash
        working-directory: signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          FILE="$(ls *.exe | head -1)"
          npx --yes @tauri-apps/cli@2.11.4 signer sign "$FILE"
          ls -la

      - name: Check the signature really verifies
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $file = Get-ChildItem signed/*.exe | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $signtool.FullName verify /pa /v $file.FullName
          if ($LASTEXITCODE -ne 0) { throw "the installer is not validly signed" }

      # Nothing leaves this pipeline unsigned unless somebody deliberately says so.
      #
      # An unsigned installer that self-updates is what Defender's heuristics call
      # a trojan; this project shipped several and they were quarantined on install.
      # The only fix is an Authenticode signature, so a release now fails here
      # rather than reaching users naked. Set the repository variable
      # ALLOW_UNSIGNED=true to override, and remove it once signing works.
      - name: Refuse to publish an unsigned build
        if: env.HAS_SIGNPATH != 'true' && vars.ALLOW_UNSIGNED != 'true'
        shell: bash
        run: |
          echo "::error::SignPath is not configured, so this installer carries no Authenticode signature."
          echo "Unsigned builds get flagged and quarantined. Configure signing, or set the"
          echo "repository variable ALLOW_UNSIGNED=true to publish this one anyway."
          exit 1

      - name: Attach to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNPATH == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" signed/*.exe signed/*.sig

      - name: Keep the unsigned build when signing is not set up
        if: env.HAS_SIGNPATH != 'true'
        run: |
          echo "::warning::SignPath secrets are not configured, so this installer is unsigned."
