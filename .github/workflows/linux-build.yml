name: linux-build

on:
  push:
    branches: [linux-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the interface
        working-directory: desktop/ui-next
        run: |
          npm ci
          npm run build

      - name: Build the app
        working-directory: desktop/src-tauri
        run: cargo build --release --locked

      - name: Package a deb and an AppImage
        working-directory: desktop/src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 build --no-bundle || true
          npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quotavpn-linux
          path: |
            desktop/src-tauri/target/release/quotavpn
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
